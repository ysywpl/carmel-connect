      notesPh: '记下发现、见过的人、姓名与年代。', copy: '复制我的笔记', saved: '仅保存在本浏览器。', copied: '已复制。',
      days: '第', to: '至', from: '传统上始于', optional: '可选站点', yrCE: '年', yrBCE: '年', d: '天', approx: '约', lang: '语言'
    }
  };

  var lang = 'en', year = 1650, jx = true, sel = 1, view = { cx: W / 2, cy: H / 2, w: W }, raf = 0;
  var store = { notes: {}, done: {}, lang: 'en' };
  var KEY = 'hongnong-yang-route-v1';
  try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); store.notes = o.notes || {}; store.done = o.done || {}; if (o.lang) lang = o.lang; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ notes: store.notes, done: store.done, lang: lang })); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var svg = $('map');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function t(k) { return T[lang][k]; }
  function L(pair) { return lang === 'zh' ? pair[1] : pair[0]; }
  function stopOf(n) { return STOPS[n - 1]; }
  function stopVisible(s) { return (!s.optional || jx) && year >= s.from; }
  function nodeShown(nd) { return !(nd.s === 5 && !jx); }
  function nodeActive(nd) { return stopVisible(stopOf(nd.s)); }
  function stopName(s) { return lang === 'zh' ? s.zh : s.en; }
  function dayText(s) { return lang === 'zh' ? '第 ' + s.days[0] + ' 至 ' + s.days[1] + ' 天' : 'Days ' + s.days[0] + ' to ' + s.days[1]; }

  function viewH() { return view.w * H / W; }
  function k() { return view.w / W; }

  function base() {
    var out = '';
    for (var lon = 108; lon <= 122; lon += 2) { var a = P(lon, 40), b = P(lon, 20); out += '<line x1="' + a[0] + '" y1="-200" x2="' + b[0] + '" y2="1100" stroke="var(--line)" stroke-width="0.6" opacity="0.7"/>'; }
    for (var lat = 24; lat <= 36; lat += 2) { var c = P(100, lat), d = P(130, lat); out += '<line x1="-400" y1="' + c[1] + '" x2="1200" y2="' + d[1] + '" stroke="var(--line)" stroke-width="0.6" opacity="0.7"/>'; }
    return '<path d="' + path(COAST, true) + '" fill="var(--land)" stroke="var(--line)" stroke-width="1.2"/>' + out +
      '<path d="' + path(YELLOW) + '" fill="none" stroke="var(--river)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + path(YANGTZE) + '" fill="none" stroke="var(--river)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="' + path(WEI) + '" fill="none" stroke="var(--river)" stroke-width="1.6" stroke-linecap="round"/>';
  }
  function geoLabels(kk) {
    function tx(lon, lat, s, size) { var p = P(lon, lat); return '<text x="' + p[0] + '" y="' + p[1] + '" font-size="' + (size * kk) + '" fill="var(--muted)" font-style="italic" text-anchor="middle" opacity="0.9">' + s + '</text>'; }
    var yellow = lang === 'zh' ? '黄河' : 'Yellow River', yang = lang === 'zh' ? '长江' : 'Yangtze', wei = lang === 'zh' ? '渭河' : 'Wei River';
    var south = lang === 'zh' ? '南海' : 'South China Sea', east = lang === 'zh' ? '东海' : 'East China Sea';
    return tx(110.9, 36.0, yellow, 11) + tx(112.6, 30.4, yang, 11) + tx(108.2, 34.65, wei, 9.5) + tx(117.8, 22.7, south, 11) + tx(121.4, 28.3, east, 11);
  }
  function arrow(a, b, kk, dashed, active) {
    var dx = b.p[0] - a.p[0], dy = b.p[1] - a.p[1], d = Math.sqrt(dx * dx + dy * dy), ux = dx / d, uy = dy / d;
    var ra = (a.main ? 12 : 5) * kk + 2 * kk, rb = (b.main ? 12 : 5) * kk + 3 * kk;
    if (d < ra + rb + 6 * kk) return '';
    var x1 = a.p[0] + ux * ra, y1 = a.p[1] + uy * ra, x2 = b.p[0] - ux * rb, y2 = b.p[1] - uy * rb;
    var col = active ? 'var(--route)' : 'var(--muted)', op = active ? 1 : 0.35, sw = (active ? 2.4 : 1.4) * kk;
    var s = 8 * kk, px = -uy, py = ux;
    var head = active ? '<polygon points="' + x2 + ',' + y2 + ' ' + (x2 - ux * s + px * s * 0.5) + ',' + (y2 - uy * s + py * s * 0.5) + ' ' + (x2 - ux * s - px * s * 0.5) + ',' + (y2 - uy * s - py * s * 0.5) + '" fill="' + col + '"/>' : '';
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="' + sw + '" opacity="' + op + '"' +
      (dashed || !active ? ' stroke-dasharray="' + (6 * kk) + ' ' + (5 * kk) + '"' : '') + ' stroke-linecap="round"/>' + head;
  }
  function draw() {
    var kk = k(), h = viewH();
    svg.setAttribute('viewBox', (view.cx - view.w / 2) + ' ' + (view.cy - h / 2) + ' ' + view.w + ' ' + h);
    var list = ROUTE.filter(function (id) { return nodeShown(byId[id]); }).map(function (id) { return byId[id]; });
    var out = '<g font-family="var(--body)">' + base() + geoLabels(kk);
    for (var i = 0; i < list.length - 1; i++) {
      var a = list[i], b = list[i + 1], dashed = a.s === 5 || b.s === 5;
      out += arrow(a, b, kk, dashed, nodeActive(a) && nodeActive(b));
    }
    var showSub = kk < 0.6;
    NODES.forEach(function (nd) {
      if (!nodeShown(nd)) return;
      var on = nodeActive(nd), isSel = nd.s === sel, x = nd.p[0], y = nd.p[1];
      var name = lang === 'zh' ? nd.zh : nd.en + ' ' + nd.zh;
      var op = on ? 1 : 0.3, r = nd.main ? 12 : 5;
      var g = '<g class="hit" data-stop="' + nd.s + '" opacity="' + op + '" transform="translate(' + x + ' ' + y + ') scale(' + kk + ')">';
      if (isSel && nd.main) g += '<circle r="18" fill="none" stroke="var(--accent)" stroke-width="2"/>';
      if (nd.main) g += '<circle r="' + r + '" fill="' + (isSel ? 'var(--accent)' : 'var(--pin)') + '" stroke="var(--land)" stroke-width="2"/><text y="4.6" text-anchor="middle" font-size="13" font-weight="700" font-family="var(--display)" fill="var(--bg)">' + nd.main + '</text>';
      else g += '<circle r="' + (isSel ? 5.5 : 4.5) + '" fill="' + (isSel ? 'var(--accent)' : 'var(--land)') + '" stroke="' + (isSel ? 'var(--accent)' : 'var(--pin)') + '" stroke-width="2"/>';
      if (nd.main || showSub) g += '<text x="' + nd.lab[0] + '" y="' + nd.lab[1] + '" text-anchor="' + nd.lab[2] + '" font-size="' + (nd.main ? 12.5 : 11) + '" font-weight="' + (nd.main ? 700 : 500) + '" fill="var(--ink)" stroke="var(--land)" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">' + name + '</text>';
      g += '<circle r="' + (nd.main ? 20 : 12) + '" fill="transparent"/></g>';
      out += g;
    });
    svg.innerHTML = out + '</g>';
  }

  function setView(v) { view = v; draw(); }
  function fly(target) {
    cancelAnimationFrame(raf);
    if (reduced) { setView(target); return; }
    var s = { cx: view.cx, cy: view.cy, w: view.w }, t0 = performance.now();
    (function step(now) {
      var p = Math.min(1, (now - t0) / 600), e = 1 - Math.pow(1 - p, 3);
      setView({ cx: s.cx + (target.cx - s.cx) * e, cy: s.cy + (target.cy - s.cy) * e, w: s.w + (target.w - s.w) * e });
      if (p < 1) raf = requestAnimationFrame(step);
    })(t0);
  }
  function fitAll() { return { cx: W / 2, cy: H / 2, w: W }; }
  function fitStop(n) {
    var pts = NODES.filter(function (nd) { return nd.s === n && nodeShown(nd); }).map(function (nd) { return nd.p; });
    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
    var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs), miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
    var w = Math.max(maxx - minx + 240, (maxy - miny + 200) * W / H, 280);
    return { cx: (minx + maxx) / 2, cy: (miny + maxy) / 2, w: Math.min(w, W) };
  }

  function select(n, noFly) {
    sel = n; renderPanel(); renderStrip(); draw();
    if (!noFly) fly(fitStop(n));
  }

  function renderStrip() {
    $('strip').innerHTML = STOPS.map(function (s) {
      var off = s.optional && !jx;
      return '<button style="flex:' + (s.days[1] - s.days[0] + 1) + '" data-n="' + s.n + '"' + (off ? ' disabled' : '') + (s.n === sel ? ' aria-current="true"' : '') +
        ' title="' + stopName(s) + '"><b>' + s.n + '</b><span>' + (s.days[1] - s.days[0] + 1) + t('d') + '</span></button>';
    }).join('');
  }
  $('strip').addEventListener('click', function (e) { var b = e.target.closest('button[data-n]'); if (b && !b.disabled) select(+b.dataset.n); });

  function renderPanel() {
    var s = stopOf(sel), done = store.done[s.n] || {};
    var html = '<div class="phead"><div class="badge">' + s.n + '</div><div><h2>' + stopName(s) + (lang === 'en' ? ' <span style="font-family:var(--serif-zh);font-size:18px;color:var(--muted)">' + s.zh + '</span>' : '') + '</h2>' +
      '<div class="days">' + dayText(s) + (s.optional ? ' · ' + t('optional') : '') + '</div><span class="tag">' + t('from') + ': ' + L(s.era) + '</span></div></div>' +
      '<div class="sec"><p class="label">' + t('sig') + '</p><p>' + L(s.sig) + '</p></div>' +
      '<div class="sec"><p class="label">' + t('focus') + '</p><ul>' + s.focus.map(function (f) { return '<li>' + (lang === 'zh' ? f[1] : f[0] + ' <span style="color:var(--muted)">' + f[1] + '</span>') + '</li>'; }).join('') + '</ul></div>' +
      '<div class="sec"><p class="label">' + t('todo') + '</p><ul class="todo">' + s.todo.map(function (q, i) {
        return '<li><label><input type="checkbox" data-i="' + i + '"' + (done[i] ? ' checked' : '') + '><span>' + L(q) + '</span></label></li>';
      }).join('') + '</ul></div>' +
      '<div class="sec"><p class="label">' + t('notes') + '</p><textarea id="note" placeholder="' + t('notesPh') + '"></textarea>' +
      '<div class="row"><button class="btn" id="copy">' + t('copy') + '</button><span class="fine" style="margin:0" id="msg">' + t('saved') + '</span></div>' +
      '<textarea id="export" readonly></textarea></div>';
    $('panel').innerHTML = html;
    $('note').value = store.notes[s.n] || '';
  }
  $('panel').addEventListener('input', function (e) {
    if (e.target.id === 'note') { store.notes[sel] = e.target.value; save(); }
  });
  $('panel').addEventListener('change', function (e) {
    if (e.target.matches('.todo input')) { var d = store.done[sel] || (store.done[sel] = {}); d[e.target.dataset.i] = e.target.checked; save(); }
  });
  $('panel').addEventListener('click', function (e) {
    if (e.target.id !== 'copy') return;
    var text = STOPS.map(function (s) {
      var d = store.done[s.n] || {};
      return s.n + '. ' + s.en + ' ' + s.zh + ' (' + dayText(s) + ')\n' + s.todo.map(function (q, i) { return (d[i] ? '[x] ' : '[ ] ') + L(q); }).join('\n') + '\n' + (store.notes[s.n] || '');
    }).join('\n\n');
    var msg = $('msg'), ex = $('export');
    function fallback() { ex.style.display = 'block'; ex.value = text; ex.focus(); ex.select(); }
    try { navigator.clipboard.writeText(text).then(function () { msg.textContent = t('copied'); }, fallback); } catch (err) { fallback(); }
  });

  function eraOf(y) { for (var i = 0; i < ERAS.length; i++) if (y >= ERAS[i][0] && y < ERAS[i][1]) return ERAS[i]; return ERAS[ERAS.length - 1]; }
  function renderTime() {
    var e = eraOf(year);
    $('era-name').textContent = year >= 1650 ? (lang === 'zh' ? '全程' : 'Full route') : (lang === 'zh' ? e[3] : e[2]);
    var yy = Math.abs(year);
    $('era-yr').textContent = year >= 1650 ? '' : (lang === 'zh' ? t('approx') + (year < 0 ? '公元前' : '公元') + yy + t('yrCE') : t('approx') + ' ' + yy + ' ' + (year < 0 ? t('yrBCE') : t('yrCE')));
  }
  $('year').addEventListener('input', function (e) { year = +e.target.value; renderTime(); draw(); });
  function renderChips() {
    $('chips').innerHTML = CHIPS.map(function (c) { return '<button data-y="' + c[0] + '">' + (lang === 'zh' ? c[2] : c[1]) + '</button>'; }).join('');
  }
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('button[data-y]'); if (!b) return; year = +b.dataset.y; $('year').value = year; renderTime(); draw(); });

  function applyStatic() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    $('t-title').textContent = t('title'); $('t-sub').textContent = t('sub'); $('t-jx').textContent = t('jx');
    $('zreset').textContent = t('reset'); $('t-cap').textContent = t('cap'); $('t-fine').textContent = t('fine'); $('t-strip').textContent = t('strip');
    $('l-en').setAttribute('aria-pressed', lang === 'en'); $('l-zh').setAttribute('aria-pressed', lang === 'zh');
    document.title = lang === 'zh' ? '弘农杨氏寻根路线' : 'Hongnong Yang Route';
    renderChips(); renderTime(); renderStrip(); renderPanel(); draw();
  }
  $('l-en').addEventListener('click', function () { lang = 'en'; save(); applyStatic(); });
  $('l-zh').addEventListener('click', function () { lang = 'zh'; save(); applyStatic(); });
  $('jx').addEventListener('change', function (e) {
    jx = e.target.checked;
    if (!jx && sel === 5) sel = 4;
    renderStrip(); renderPanel(); draw();
  });

  $('zin').addEventListener('click', function () { fly({ cx: view.cx, cy: view.cy, w: Math.max(160, view.w * 0.65) }); });
  $('zout').addEventListener('click', function () { fly({ cx: view.cx, cy: view.cy, w: Math.min(W, view.w / 0.65) }); });
  $('zreset').addEventListener('click', function () { fly(fitAll()); });

  svg.addEventListener('click', function (e) {
    var g = e.target.closest('[data-stop]'); if (!g) return;
    var n = +g.getAttribute('data-stop'); if (stopOf(n).optional && !jx) return; select(n);
  });
  var drag = null;
  svg.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false }; });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    drag.moved = true; cancelAnimationFrame(raf);
    var r = svg.getBoundingClientRect(), sc = Math.min(r.width / view.w, r.height / viewH());
    setView({ cx: drag.cx - dx / sc, cy: drag.cy - dy / sc, w: view.w });
  });
  window.addEventListener('pointerup', function () { drag = null; });

  applyStatic();
})();
</script>
