label.btn { cursor: pointer; }

  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.lbx { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; color: #111; font-size: 22px; }
@media (max-width: 920px) {

  .panel { position: static; }
  #map { max-height: none; }

  function noteBlock(key, ph, small) {

      '<div class="photos"></div><div class="row"><label class="btn addpic" hidden>' + t('addPic') + '<input type="file" accept="image/*" multiple hidden data-key="' + key + '"></label><span class="fine msg" style="margin:0"></span></div></div>';
  }
  function blockMsg(key, text) {
    var el = document.querySelector('.nb[data-key="' + key + '"] .msg'); if (el) el.textContent = text;
  }
  function errText(e) {
    var c = e && e.code;
    if (c === 'quota_or_state' || c === 'quota_exceeded') return t('errFull');
    if (c === 'unsupported_type') return t('errType');
    if (c === 'too_large') return t('errBig');
    return t('errGeneric');
  }
  function refreshBlock(el) {
    var key = el.getAttribute('data-key'), ta = el.querySelector('textarea');
    if (document.activeElement !== ta) ta.value = getText(key);
    ta.readOnly = mode === 'shared' && !canWrite;
    el.querySelector('.addpic').hidden = !(mode === 'shared' && canWrite && assetsNs);
    el.querySelector('.photos').innerHTML = getPhotos(key).map(function (id) {
      return '<div class="ph"><img src="/_blob/' + id + '" alt="" loading="lazy" data-open="' + id + '">' +
        (canWrite ? '<button class="x" data-del="' + id + '" aria-label="' + t('remove') + '">×</button>' : '') + '</div>';
    }).join('');
  }
  function hydrate() { document.querySelectorAll('.nb').forEach(refreshBlock); }
  function write(key, patchFn) {
    chain[key] = (chain[key] || Promise.resolve()).then(function () {
      var cur = shared[key] || {};
      var next = { text: getText(key), photos: getPhotos(key).slice(), updatedAt: Date.now() };
      var patch = patchFn(next);
      Object.keys(patch).forEach(function (k) { next[k] = patch[k]; });
      shared[key] = next;
      return dbNs.doc('notes/' + key).set(next);
    }).then(function () { blockMsg(key, t('savedShared')); }, function (e) { blockMsg(key, errText(e)); });
    return chain[key];
  }
  function saveText(key, v) {
    if (mode === 'shared') { blockMsg(key, t('saving')); write(key, function () { return { text: v }; }); }
    else { store.notes[key] = v; save(); }
  }
  function shrink(file) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var m = 1600, r = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { URL.revokeObjectURL(url); resolve(b || file); }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }
  async function addPictures(key, files) {
    for (var i = 0; i < files.length; i++) {
      blockMsg(key, t('uploading') + ' ' + (i + 1) + '/' + files.length);
      try {
        var blob = await shrink(files[i]);
        var res = await assetsNs.upload(blob, blob.type ? undefined : { type: 'image/jpeg' });
        await write(key, function (cur) { return { photos: cur.photos.concat([res.id]) }; });
      } catch (e) { blockMsg(key, errText(e)); return; }
    }
  }
  var lightbox = document.createElement('div');
  lightbox.className = 'lightbox'; lightbox.hidden = true;
  lightbox.innerHTML = '<button class="lbx" aria-label="Close">×</button><img alt="">';
  document.body.appendChild(lightbox);
  function closeLightbox() { lightbox.hidden = true; lightbox.querySelector('img').removeAttribute('src'); }
  lightbox.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lightbox.hidden) closeLightbox(); });
  var armed = null;
  $('panel').addEventListener('click', function (e) {
    var op = e.target.closest('[data-open]');
    if (op) { lightbox.querySelector('img').src = '/_blob/' + op.getAttribute('data-open'); lightbox.hidden = false; return; }
    var del = e.target.closest('[data-del]');
    if (!del) return;
    var id = del.getAttribute('data-del'), key = del.closest('.nb').getAttribute('data-key');
    if (armed !== id) { armed = id; del.textContent = '?'; del.title = t('confirmRemove'); blockMsg(key, t('confirmRemove')); setTimeout(function () { if (armed === id) { armed = null; del.textContent = '×'; } }, 3000); return; }
    armed = null;
    write(key, function (cur) { return { photos: cur.photos.filter(function (x) { return x !== id; }) }; }).then(function () {
      if (assetsNs) assetsNs.delete(id).catch(function () {});
    });
  });
  $('panel').addEventListener('change', function (e) {
    if (e.target.matches('input[type="file"]')) { var f = Array.prototype.slice.call(e.target.files); e.target.value = ''; if (f.length) addPictures(e.target.getAttribute('data-key'), f); }
  });
  async function initShared() {
    try {
      dbNs = await claude.use('db'); assetsNs = await claude.use('assets');
      var u = await claude.use('user');
      if (u && u.can) { var cw = u.can('data.write'); if (cw === false) canWrite = false; }
    } catch (e) { dbNs = null; }
    if (!dbNs) { hydrate(); return; }
    dbNs.collection('notes').onSnapshot(function (snap) {
      mode = 'shared'; shared = {};
      snap.docs.forEach(function (d) { shared[d.id] = d.data(); });
      hydrate();
      var m = document.getElementById('msg'); if (m) m.textContent = t('savedShared');
    }, function () { mode = 'local'; hydrate(); });
  }

  function legName(n) { return stopName(stopOf(n)); }
  function gettingHere(s) {
    var leg = activeLegs().filter(function (x) { return x.b === s.n; })[0];
    var h = '<div class="sec"><p class="label">' + t('getting') + '</p>';
    if (!leg) return h + '<p>' + t('startNote') + '</p></div>';
    var d = leg.d;
    h += '<div class="leg"><span><b>' + legName(leg.a) + '</b>' + (lang === 'zh' ? ' 至 ' : ' to ') + '<b>' + legName(leg.b) + '</b></span>' +
      '<span>' + t('line') + ': ' + leg.km + ' ' + t('km') + '</span>' +
      '<span>' + t('by') + ': ' + L(d.mode) + '. ' + L(d.time) + '</span>' +
      '<span><span class="pill ' + d.conf + '">' + L(CONF[d.conf]) + '</span></span>' +
      '<span class="fine" style="margin:0">' + L(d.note) + '</span></div>' +
      '<p class="label" style="margin-top:10px">' + t('legNotes') + '</p>' + noteBlock('leg-' + leg.a + '-' + leg.b, t('legPh'), true) + '</div>';
    return h;
  }
  function renderTravel() {
    var legs = activeLegs(), sum = 0;
    var rows = legs.map(function (x) {
      if (x.b !== 10) sum += x.km;
      return '<tr><td>' + legName(x.a) + ' → ' + legName(x.b) + '</td><td class="n">' + x.km + ' ' + t('km') + '</td><td>' + L(x.d.time) + '</td><td><span class="pill ' + x.d.conf + '">' + L(CONF[x.d.conf]) + '</span></td></tr>';
    }).join('');
    $('travel').innerHTML = '<thead><tr><th>' + t('legFrom') + '</th><th>' + t('line') + '</th><th>' + t('by') + '</th><th></th></tr></thead><tbody>' + rows +
      '<tr><td><b>' + t('total') + '</b></td><td class="n"><b>' + sum + ' ' + t('km') + '</b></td><td></td><td></td></tr></tbody>';
  }

  function stayBlock(s) {
    var st = STAY[s.n]; if (!st) return '';
    return '<div class="sec"><p class="label">' + t('stay') + '</p><div class="stay"><span><b>' + t('city') + ': ' + (lang === 'zh' ? st.city[1] : st.city[0] + ' ' + st.city[1]) + '</b></span>' +
      '<span>' + t('arrive') + ': ' + L(st.station) + '</span><span><span class="pill ' + (st.conf === 'sourced' ? 'sourced' : 'estimate') + '">' + (st.conf === 'sourced' ? t('conf1') : t('conf2')) + '</span></span>' +
      '<span class="fine" style="margin:0">' + L(st.note) + '</span></div></div>';
  }
  function dialectBlock(s) {
    var d = DIALECT[s.n]; if (!d) return '';
    return '<div class="sec"><p class="label">' + t('dialect') + '</p><div class="dia"><span><b>' + t('today') + ':</b> ' + L(d.today) + '</span><span><b>' + t('then') + ':</b> ' + L(d.then) + '</span>' +
      '<span class="fine" style="margin:0">' + t('diaNote') + ' ' + t('diaSrc') + ': ' + DIA_SOURCES.map(function (x) { return '<a href="' + x[1] + '" target="_blank" rel="noopener">' + x[0] + '</a>'; }).join(', ') + '.</span></div></div>';
  }
  function renderPanel() {
    var s = stopOf(sel), done = store.done[s.n] || {};
    var html = '<div class="phead"><div class="badge">' + (s.n === 9 ? 'W' : s.n === 10 ? 'G' : s.n) + '</div><div><h2>' + stopName(s) + (lang === 'en' ? ' <span style="font-family:var(--serif-zh);font-size:18px;color:var(--muted)">' + s.zh + '</span>' : '') + '</h2>' +
      '<div class="days">' + dayText(s) + '</div><span class="tag">' + t('from') + ': ' + L(s.era) + '</span></div></div>' +
      '<div class="sec"><p class="label">' + t('sig') + '</p><p>' + L(s.sig) + '</p></div>' + stayBlock(s) + gettingHere(s) + '<div class="sec"><p class="label">' + t('keysites') + '</p><ul>' + s.focus.map(function (f, i) { var tg = (TAGS[s.n] || [])[i] || 'C'; return '<li><span class="kt ' + tg + '">' + L(TAGNAME[tg]) + '</span>' + (lang === 'zh' ? f[1] : f[0] + ' <span style="color:var(--muted)">' + f[1] + '</span>') + '</li>'; }).join('') + '</ul></div>' + dialectBlock(s) +
      '<div class="sec"><p class="label">' + t('todo') + '</p><ul class="todo">' + s.todo.map(function (q, i) {
        return '<li><label><input type="checkbox" data-i="' + i + '"' + (done[i] ? ' checked' : '') + '><span>' + L(q) + '</span></label></li>';
      }).join('') + '</ul></div>' +
      '<div class="sec"><p class="label">' + t('notes') + '</p>' + noteBlock('stop-' + s.n, t('notesPh'), false) +
      '<div class="row"><button class="btn" id="copy">' + t('copy') + '</button><span class="fine" style="margin:0" id="msg">' + (mode === 'shared' ? t('savedShared') : t('saved')) + '</span></div>' +
      '<textarea id="export" readonly></textarea></div>';
    $('panel').innerHTML = html;
    hydrate();
  }
  $('panel').addEventListener('input', function (e) {
    if (e.target.classList.contains('note')) {
      var key = e.target.getAttribute('data-key'), v = e.target.value;
      clearTimeout(timers[key]); timers[key] = setTimeout(function () { saveText(key, v); }, 700);
    }
  });
  $('panel').addEventListener('change', function (e) {
    if (e.target.matches('.todo input')) { var d = store.done[sel] || (store.done[sel] = {}); d[e.target.dataset.i] = e.target.checked; save(); }
  });
  $('panel').addEventListener('click', function (e) {
    if (e.target.id !== 'copy') return;
    var text = STOPS.map(function (s) {
      var d = store.done[s.n] || {};
      return s.n + '. ' + s.en + ' ' + s.zh + ' (' + dayText(s) + ')\n' + s.todo.map(function (q, i) { return (d[i] ? '[x] ' : '[ ] ') + L(q); }).join('\n') + '\n' + getText('stop-' + s.n);
    }).join('\n\n');
    var msg = $('msg'), ex = $('export');
    function fallback() { ex.style.display = 'block'; ex.value = text; ex.focus(); ex.select(); }
    try { navigator.clipboard.writeText(text).then(function () { msg.textContent = t('copied'); }, fallback); } catch (err) { fallback(); }
  });

  function eraOf(y) { for (var i = 0; i < ERAS.length; i++) if (y >= ERAS[i][0] && y < ERAS[i][1]) return ERAS[i]; return ERAS[ERAS.length - 1]; }
  function renderTime() {
    var e = eraOf(year);
    $('era-name').textContent = year >= 1650 ? (lang === 'zh' ? '全程' : 'Full route') : (lang === 'zh' ? e[3] : e[2]);
    var yy = Math.abs(year);
    $('era-yr').textContent = year >= 1650 ? '' : (lang === 'zh' ? t('approx') + (year < 0 ? '公元前' : '公元') + yy + t('yrCE') : t('approx') + ' ' + yy + ' ' + (year < 0 ? t('yrBCE') : t('yrCE')));
  }
  $('year').addEventListener('input', function (e) { year = +e.target.value; renderTime(); draw(); });
  function renderChips() {
    $('chips').innerHTML = CHIPS.map(function (c) { return '<button data-y="' + c[0] + '">' + (lang === 'zh' ? c[2] : c[1]) + '</button>'; }).join('');
  }
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('button[data-y]'); if (!b) return; year = +b.dataset.y; $('year').value = year; renderTime(); draw(); });

  function applyStatic() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    $('t-title').textContent = t('title'); $('t-sub').textContent = t('sub'); $('t-gz').textContent = t('gz'); $('t-wy').textContent = t('wy');
    $('zreset').textContent = t('reset'); $('t-cap').textContent = t('cap'); $('t-fine').textContent = t('fine'); $('t-strip').textContent = t('strip'); $('t-prov').textContent = t('prov'); $('t-travel').textContent = t('travel'); $('t-travelfine').textContent = t('travelFine');
    $('srcs').innerHTML = t('srcs') + ': ' + SOURCES.map(function (x) { return '<a href="' + x[1] + '" target="_blank" rel="noopener">' + x[0] + '</a>'; }).join(', ');
    $('l-en').setAttribute('aria-pressed', lang === 'en'); $('l-zh').setAttribute('aria-pressed', lang === 'zh');
    document.title = lang === 'zh' ? '弘农杨氏寻根路线' : 'Hongnong Yang Route';
    renderChips(); renderTime(); renderStrip(); renderPanel(); renderTravel(); draw();
  }
  $('l-en').addEventListener('click', function () { lang = 'en'; save(); applyStatic(); });
  $('l-zh').addEventListener('click', function () { lang = 'zh'; save(); applyStatic(); });
  $('gz').addEventListener('change', function (e) {
    gz = e.target.checked;
    if (!gz && sel === 10) sel = 1;
    renderStrip(); renderPanel(); renderTravel(); draw();
  });

  $('prov').addEventListener('change', function (e) { provOn = e.target.checked; draw(); });
  $('wy').addEventListener('change', function (e) {
    wy = e.target.checked;
    if (!wy && sel === 9) sel = 1;
    renderStrip(); renderPanel(); renderTravel(); draw();
  });
  $('zin').addEventListener('click', function () { fly({ cx: view.cx, cy: view.cy, w: Math.max(160, view.w * 0.65) }); });
  $('zout').addEventListener('click', function () { fly({ cx: view.cx, cy: view.cy, w: Math.min(W, view.w / 0.65) }); });
  $('zreset').addEventListener('click', function () { fly(fitAll()); });

  svg.addEventListener('click', function (e) {
    var g = e.target.closest('[data-stop]'); if (!g) return;
    var n = +g.getAttribute('data-stop'); if (!stopEnabled(stopOf(n))) return; select(n);
    if (window.innerWidth <= 920) { try { $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (err) {} }
  });
  var drag = null;
  svg.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false }; });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    drag.moved = true; cancelAnimationFrame(raf);
    var r = svg.getBoundingClientRect(), sc = Math.min(r.width / view.w, r.height / viewH());
    setView({ cx: drag.cx - dx / sc, cy: drag.cy - dy / sc, w: view.w });
  });
  window.addEventListener('pointerup', function () { drag = null; });

  applyStatic();
  initShared();
})();
</script>
